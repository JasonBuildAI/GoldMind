[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
asyncio_mode = auto
markers =
    unit: 单元测试（不依赖数据库与网络）
    integration: 集成测试（使用内存 SQLite）
    e2e: 端到端测试（跨层，仍不访问真实外部 API）
    real_background: 保留真实的后台分析触发逻辑（默认会被夹具替换掉）
