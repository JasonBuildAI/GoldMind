# GoldMind - 完整部署配置
# 一键启动：前端 + 后端 + 数据库
#
# 不写 `version:` —— 它在 Compose V2 里已废弃，写了只会得到一条警告。

services:
  # ============================================
  # MySQL 数据库服务
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: goldmind_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-goldmind123}
      MYSQL_DATABASE: gold_analysis
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载 schema.sql 作为初始化脚本。
      # 它全部是 IF NOT EXISTS，且不自带 CREATE DATABASE / USE —— 官方 mysql 镜像
      # 会用 MYSQL_DATABASE 选好库，写死库名反而会让配置失效。
      # （原先挂的是 ./backend/init.sql，那个文件不存在：Docker 会在容器内建出一个
      #   同名**目录**，初始化脚本目录里就多一个无效条目。）
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goldmind_network

  # ============================================
  # FastAPI 后端服务
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goldmind_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # 数据库配置（覆盖 .env 里的本机配置）
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-goldmind123}@mysql:3306/gold_analysis
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-goldmind123}
      - DB_NAME=gold_analysis
      # 注意：这里**不要**再写 MIMO_API_KEY / MIMO_BASE_URL / MIMO_MODEL。
      #
      # `environment` 的优先级高于 `env_file`，而 `${MIMO_API_KEY}` 这种插值只认
      # 宿主环境与 compose 项目目录下的 .env —— 不认 env_file。本仓库根目录没有 .env，
      # 所以原来那句 `- MIMO_API_KEY=${MIMO_API_KEY}` 会插值成**空串**，
      # 反过来把 backend/.env 里配好的 key 覆盖掉，容器里的 LLM 直接不可用。
      # 这三个值由 env_file 提供即可；缺省值 config.py 里也有。
      #
      # 应用配置
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - backend_cache:/app/cache
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - goldmind_network

  # ============================================
  # React 前端服务 (Nginx)
  # ============================================
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: goldmind_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - goldmind_network

  # ============================================
  # Nginx 反向代理 (可选，用于生产环境)
  # ============================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: goldmind_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - ./ssl:/etc/nginx/ssl
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - goldmind_network

# ============================================
# 数据卷定义
# ============================================
volumes:
  mysql_data:
    driver: local
  backend_cache:
    driver: local
  backend_logs:
    driver: local

# ============================================
# 网络定义
# ============================================
networks:
  goldmind_network:
    driver: bridge
